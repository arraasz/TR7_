<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Creativity Festival</title>
   <script src="https://cdn.tailwindcss.com"></script>
  </head>
<body class="bg-yellow-200 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-blue-200 text-black p-6 rounded-lg shadow-md mb-8 sticky top-0 ">
        <div class="flex flex-col gap-2 p-8 flex-row items-center gap-2 py-4">
            <h1 class="text-2xl font-bold gray-100">Student Creativity Festival</h1>
             <p>Showcase Your Creativity, Skills and Innovative Ideas</p>
        </header>
 
     <main class="max-w-4xl mx-auto px-4 py-6 bg-blue-200 shadow-md rounded-lg">
    <section id="about" class="bg-white-200 p-6 rounded-lg mb-6">
  <h2 class="text-xl font-bold gray-100">Registration From</h2>
  <form>
    <!-- Input Teks (Nama) -->
    <label for="nama">Nama Lengkap:</label>
    <input type="text" id="Name" name="Name" class="w-full px-3 py-2 text-xs bg-blue-200 text-black rounded border border-gray-900/80 focus:outline-none focus:border-500 placeholder-gray-400" placeholder="Enter your full name..." required>
    
    <!-- Dropdown Option -->
    <label for="Classroom">Classroom:</label>
    <select id="Classroom" name="Classroom">
      <option value="X">X</option>
      <option value="XI">XI</option>
      <option value="XII">XII</option>
    </select><br></br>

    <!-- Radio Button -->
    <label>Jenis Kelamin:</label><br>
    <div class="radio-group">
      <input type="radio" id="Male" name="gender" value="Male">
      <label for="Male">Male</label><br>
      <input type="radio" id="Female" name="gender" value="Female">
      <label for="Female">Female</label><br>
    </div><br>


   <label for="Competition">Competition Category:</label>
    <select>
      <option value="Web Development">Web Development</option>
      <option value="IoT Project">IoT Project</option>
      <option value="Graphic Design">Graphic Design</option>
      <option value="Public Speaking">Public Speaking</option>
      <option value="Photography">Photography</option>
    </select><br></br>

    <!-- Radio Button -->
    <label class="text-lg font-semibold mt-6 mb-3 text-yellow-700">Participation Type:</label>
    <div class="radio-group">
      <input type="radio" id="Individual" name="Participation Type" value="Individual">
      <label for="Individual">Individual</label>
      <input type="radio" id="Team" name="Participation Type" value="Team">
      <label for="Team">Team</label>
    </div>

    <div>
         <label for="Team Name" class="block text-sm font-medium text-gray-700">Team Name:</label>
         <input type="Team Name" id="Team Name" class="w-full px-3 py-2 text-xs bg-blue-200 text-black rounded border border-gray-900/80 focus:outline-none focus:border-500 placeholder-gray-400" placeholder="Enter your's team name...">
    </div><br>

      <section id="skills" class="bg-white p-6 rounded-lg border shadow-sm mb-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Contact Number</h2>
            <div class="flex flex-wrap gap-2">
                <span class="bg-yellow-200 border px-3 py-1 rounded-full text-sm font-medium">08xxxxx</span>
                <p class="text-gray-600 mb-4 leading-relaxed">Please contact this person.</p>
 </div>
 </section>
 
 <div>
      <label for="team name" class="font-medium text-s text-gyay-900 ">Project Description:</label>
      <textarea id="message" name="message" placeholder="Discrabe your Project or Competition country" class="w-full px-3 py-2 text-xs bg-white text-gray-900 rounded border border-indigo-900/80 focus:outline-none focus:border-indigo-500 placeholder:text-indigo-400" required></textarea>
                
    </div>

   </div>
            <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium transistion-color">Register Now</button>
</div>
</header>
</body>
